<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Погода</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F9F9FF;--on-surface:#191C20;--on-surface-variant:#44474E;--primary:#415F91;--on-primary:#fff;--primary-container:#D6E3FF;--on-primary-container:#001B3E;--secondary-container:#DBE2F9;--on-secondary-container:#141B2C;--surface-container:#ECEDF4;--surface-container-high:#E6E8EE;--outline-variant:#C4C6D0;color-scheme:light}
:root[data-theme=dark]{--bg:#111318;--on-surface:#E2E2E9;--on-surface-variant:#C4C6D0;--primary:#AAC7FF;--on-primary:#0A305F;--primary-container:#284777;--on-primary-container:#D6E3FF;--secondary-container:#3F4759;--on-secondary-container:#DBE2F9;--surface-container:#1D2024;--surface-container-high:#282A2F;--outline-variant:#44474E;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--on-surface);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.bar{position:fixed;top:0;left:0;right:0;height:4px;overflow:hidden;background:var(--secondary-container);display:none;z-index:5}
.bar.on{display:block}
.bar::after{content:"";display:block;height:100%;width:40%;background:var(--primary);border-radius:2px;animation:slide 1.1s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.search{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 16px;border-radius:28px;background:var(--surface-container-high)}
.search svg{width:24px;height:24px;fill:var(--on-surface-variant);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--on-surface)}
.search input::placeholder{color:var(--on-surface-variant)}
.sug{list-style:none;margin-top:8px;padding:8px 0;border-radius:24px;background:var(--surface-container-high);overflow:hidden}
.sug li{padding:12px 24px;cursor:pointer}
.sug li:active{background:rgba(127,127,127,.18)}
.sug small{display:block;color:var(--on-surface-variant);font-size:12px}
.hero{margin-top:16px;padding:24px;border-radius:28px;background:var(--primary-container);color:var(--on-primary-container)}
.hero .city{font-size:16px;font-weight:500}
.hero .row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.hero .temp{font-size:76px;line-height:1;font-weight:300;letter-spacing:-2px}
.hero .ico{font-size:72px;line-height:1}
.hero .desc{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:6px 12px;border-radius:8px;border:1px solid currentColor;font-size:13px}
.title{font-size:14px;font-weight:500;color:var(--on-surface-variant);margin:24px 4px 8px}
.hours{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.h{flex:none;width:64px;padding:12px 0;border-radius:20px;background:var(--surface-container);text-align:center;font-size:14px}
.h b{display:block;font-weight:500}
.h i{display:block;font-style:normal;font-size:24px;margin:6px 0}
.h small{display:block;margin-top:4px;font-size:11px;color:var(--on-surface-variant)}
.h.now{background:var(--primary);color:var(--on-primary)}
.h.now small{color:inherit;opacity:.85}
.days{border-radius:24px;background:var(--surface-container);overflow:hidden}
.d{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:14px 20px}
.d+.d{border-top:1px solid var(--outline-variant)}
.d .e{font-size:28px}
.d .n{font-weight:500}
.d .n small{display:block;font-weight:400;font-size:12px;color:var(--on-surface-variant)}
.d .r{font-size:13px;color:var(--on-surface-variant)}
.d .t{font-weight:500;min-width:76px;text-align:right}
.err{margin-top:24px;padding:24px;border-radius:24px;background:var(--surface-container);text-align:center;line-height:1.5}
.btn{margin-top:16px;height:40px;padding:0 24px;border:0;border-radius:20px;background:var(--secondary-container);color:var(--on-secondary-container);font:inherit;font-weight:500;cursor:pointer}
.btn:active{opacity:.8}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--on-surface-variant);font-size:20px;cursor:pointer}
.icon-btn:active{background:rgba(127,127,127,.2)}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="app">
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    <input id="q" placeholder="Город в России" autocomplete="off" enterkeyhint="search">
    <button class="icon-btn" id="clr" hidden aria-label="Очистить">✕</button>
  </div>
  <ul class="sug" id="sug" hidden></ul>
  <main id="main"></main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=v=>{const r=Math.round(v);return(r>0?'+':r<0?'−':'')+Math.abs(r)+'°'};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function wmo(c,day=1){
  if(c===0)return day?['☀️','Ясно']:['🌙','Ясно'];
  if(c===1)return day?['🌤','Малооблачно']:['🌙','Малооблачно'];
  if(c===2)return['⛅','Облачно'];if(c===3)return['☁️','Пасмурно'];
  if(c<=48)return['🌫','Туман'];if(c<=57)return['🌦','Морось'];
  if(c<=67)return['🌧','Дождь'];if(c<=77)return['🌨','Снег'];
  if(c<=82)return['🌦','Ливень'];if(c<=86)return['🌨','Снегопад'];
  return['⛈','Гроза'];
}

/* Telegram + тема */
const tg=window.Telegram&&Telegram.WebApp;
function theme(){
  const dark=tg&&tg.colorScheme?tg.colorScheme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  const bg=dark?'#111318':'#F9F9FF';
  try{tg.setHeaderColor(bg);tg.setBackgroundColor(bg)}catch(e){}
}
if(tg){tg.ready();tg.expand();try{tg.onEvent('themeChanged',theme)}catch(e){}}
theme();

/* API */
async function geo(name){
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=10&language=ru&format=json`);
  const j=await r.json();
  return(j.results||[]).filter(x=>x.country_code==='RU');
}
const bar=on=>$('bar').classList.toggle('on',on);

let city={name:'Москва',admin1:'Москва',latitude:55.7558,longitude:37.6176};
/* Хранилище: облако Telegram (между устройствами и сессиями) + localStorage как запасной */
const store={
  get:k=>new Promise(res=>{
    let done=false;
    const fin=v=>{if(!done){done=true;res(v)}};
    const ls=()=>{try{fin(localStorage.getItem(k))}catch(e){fin(null)}};
    try{
      if(tg&&tg.CloudStorage&&tg.isVersionAtLeast('6.9')){
        setTimeout(ls,1500);
        tg.CloudStorage.getItem(k,(err,v)=>v?fin(v):ls());
        return;
      }
    }catch(e){}
    ls();
  }),
  set:(k,v)=>{
    try{localStorage.setItem(k,v)}catch(e){}
    try{if(tg&&tg.CloudStorage&&tg.isVersionAtLeast('6.9'))tg.CloudStorage.setItem(k,v)}catch(e){}
  }
};

async function show(c){
  city=c;
  store.set('city',JSON.stringify({name:c.name,admin1:c.admin1||'',latitude:c.latitude,longitude:c.longitude}));
  closeSug();$('q').value='';$('clr').hidden=true;$('q').blur();
  bar(true);
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}`+
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day`+
      `&hourly=temperature_2m,precipitation_probability,weather_code`+
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`+
      `&wind_speed_unit=ms&timezone=auto&forecast_days=4`;
    const r=await fetch(u);if(!r.ok)throw 0;
    render(c,await r.json());
  }catch(e){
    $('main').innerHTML='<div class="err">Не удалось загрузить погоду. Проверьте интернет и повторите.<br><button class="btn" id="retry">Повторить</button></div>';
    $('retry').onclick=()=>show(c);
  }
  bar(false);
}

function render(c,d){
  const cu=d.current,h=d.hourly,dl=d.daily;
  const [ce,cd]=wmo(cu.weather_code,cu.is_day);
  const place=esc(c.name)+(c.admin1&&c.admin1!==c.name?', '+esc(c.admin1):'');
  const s=Math.max(0,h.time.findIndex(t=>t.slice(0,13)>=cu.time.slice(0,13)));
  let hours='';
  for(let i=s;i<s+24&&i<h.time.length;i++){
    hours+=`<div class="h${i===s?' now':''}"><b>${i===s?'Сейчас':h.time[i].slice(11,16)}</b><i>${wmo(h.weather_code[i],1)[0]}</i><b>${T(h.temperature_2m[i])}</b><small>💧${h.precipitation_probability[i]||0}%</small></div>`;
  }
  let days='';
  for(let i=1;i<=3;i++){
    const dt=new Date(dl.time[i]+'T12:00:00');
    const [e,desc]=wmo(dl.weather_code[i]);
    days+=`<div class="d"><span class="e">${e}</span><div class="n">${i===1?'Завтра':cap(dt.toLocaleDateString('ru-RU',{weekday:'long'}))}<small>${dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}, ${desc.toLowerCase()}</small></div><span class="r">💧${dl.precipitation_probability_max[i]||0}%</span><span class="t">${T(dl.temperature_2m_min[i])} … ${T(dl.temperature_2m_max[i])}</span></div>`;
  }
  $('main').innerHTML=`
  <section class="hero">
    <div class="city">📍 ${place}</div>
    <div class="row"><div class="temp">${T(cu.temperature_2m)}</div><div class="ico">${ce}</div></div>
    <div class="desc">${cd}</div>
    <div class="chips">
      <span class="chip">Ощущается ${T(cu.apparent_temperature)}</span>
      <span class="chip">Ветер ${Math.round(cu.wind_speed_10m)} м/с</span>
      <span class="chip">Влажность ${cu.relative_humidity_2m}%</span>
    </div>
  </section>
  <div class="title">Ближайшие 24 часа</div>
  <div class="hours">${hours}</div>
  <div class="title">Прогноз на 3 дня</div>
  <div class="days">${days}</div>`;
}

/* Поиск */
let res=[],timer,seq=0;
function closeSug(){$('sug').hidden=true;$('sug').innerHTML=''}
function showSug(list,empty){
  res=list;
  $('sug').innerHTML=list.length
    ?list.map((x,i)=>`<li data-i="${i}">${esc(x.name)}<small>${esc(x.admin1||'')}</small></li>`).join('')
    :`<li>${empty}</li>`;
  $('sug').hidden=false;
}
$('q').addEventListener('input',e=>{
  const v=e.target.value.trim();
  $('clr').hidden=!v;clearTimeout(timer);
  if(v.length<2){closeSug();return}
  const n=++seq;
  timer=setTimeout(async()=>{
    try{const l=await geo(v);if(n===seq)showSug(l,'Город не найден')}catch(err){}
  },300);
});
$('q').addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;
  const v=e.target.value.trim();if(!v)return;
  try{const l=await geo(v);l.length?show(l[0]):showSug([],'Город не найден')}catch(err){}
});
$('sug').addEventListener('click',e=>{
  const li=e.target.closest('li[data-i]');if(li)show(res[li.dataset.i]);
});
$('clr').onclick=()=>{$('q').value='';$('clr').hidden=true;closeSug();$('q').focus()};

(async()=>{
  try{const s=JSON.parse(await store.get('city'));if(s&&s.latitude)city=s}catch(e){}
  show(city);
})();
</script>
</body>
</html>
